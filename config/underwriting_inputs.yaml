# =============================================================================
# TRACK BOSS — UNDERWRITING INPUTS
# Car Community Site Sourcing Agent · NY / CT / NJ
# =============================================================================
# Every figure here is either CONFIRMED by the principal or ASSUMED by the model.
# The `basis` key on each block records which. Assumed values are placeholders
# that MUST be replaced by Comp Analyst output before an IC memo is issued.
#
# §3 rule: never dress an assumption as a sourced figure.
# =============================================================================

meta:
  version: "2.0 — INSTITUTIONAL BASE CASE"
  confirmed_on: "2026-08-03"
  hurdle_yoc: 0.0650          # the 6.50% test, retained (net) basis
  note: >
    v2.0 replaces the v1.0 structural placeholders with a calibrated base case.
    Every figure is still ASSUMED unless marked otherwise -- these are
    benchmark-derived, internally consistent assumptions that pass the
    plausibility audit, NOT verified comps. Verified comps remain the single
    largest open item and the first use of feasibility capital.

# -----------------------------------------------------------------------------
# PRINCIPAL-CONFIRMED DECISIONS (Open Items, resolved)
# -----------------------------------------------------------------------------
mandate:
  basis: confirmed

  # ◆ YoC basis — model BOTH, rank the Executive Summary on GROSS.
  yoc_basis:
    compute: [gross, net]
    rank_on: gross
    note: >
      Gross basis holds stabilized income NOI against the entire development
      cost including the for-sale vertical, with no sell-out offset. Net basis
      subtracts net for-sale proceeds per §3. Both are reported on every parcel;
      ranking and the PASS/FAIL hurdle call use gross.

  # ◆ Hold structure — merchant build. Both components sold.
  hold_structure:
    garage_condos: sold
    homesites: sold
    ground_lease_residences: false
    note: >
      Both for-sale components sit in Stack A. Ground rent line in Stack B is
      therefore zero in the base case. Flipping either to `held` moves its
      revenue into Stack B and removes its proceeds from the net-basis offset;
      the model handles this without code changes.

  # ◆ Acreage floor — hard reject under 250; 250-350 allowed but flagged.
  acreage:
    hard_floor_acres: 250        # Gate 1 auto-reject below this
    preferred_floor_acres: 350   # below this -> SUB-SCALE flag + score penalty
    target_band_acres: [350, 700]
    note: >
      Principal set the floor as a band, not a point. Under 250 contiguous
      developable acres is an auto-reject. 250-350 stays in the workbook,
      carries a SUB-SCALE flag, and takes a graduated physical-suitability
      penalty that scales linearly to zero at 350 acres.

  # ◆ Drive-time ceiling — 2 hours max.
  drive_time:
    max_minutes: 120             # Gate 3 reject beyond this
    prize_minutes: 90            # full marks at or under this
    origins:
      - name: "Manhattan (59th St Bridge)"
        lat: 40.7580
        lon: -73.9601
      - name: "Greenwich, CT"
        lat: 41.0262
        lon: -73.6282
      - name: "Short Hills, NJ"
        lat: 40.7379
        lon: -74.3260
    rule: min_of_origins        # a parcel is scored on its BEST origin

  # ◆ Capital stack — PARTIALLY confirmed. DSCR floor set by the principal
  #   2026-08-03; leverage and pricing still open.
  capital_stack:
    basis: assumed
    equity_check_usd: null       # principal has not sized the check
    incentives_in_base_case: false
    incentives_in_upside_case: true
    note: >
      OPEN ITEM — partially unresolved. Leverage and loan pricing live in the
      `debt` block below and remain assumed; the minimum DSCR is confirmed.
      IDA/PILOT/EDA offsets are excluded from the base case and modeled only
      as upside. Confirm leverage and pricing before any IC submission.

# -----------------------------------------------------------------------------
# DEBT AND COVERAGE
# -----------------------------------------------------------------------------
# The DSCR floor is a hard covenant test that runs ALONGSIDE the yield hurdle.
# Whichever is tighter binds. See model/two_stack.py::binding_yield.
debt:
  # CONFIRMED by the principal, 2026-08-03.
  min_dscr: 1.30

  # ASSUMED. Sits at the low end of the 1.30x-1.40x band lenders quote for
  # non-multifamily commercial, which is where a special-purpose recreational
  # asset would price. [S2]
  basis: assumed

  # LOW PERMANENT LEVERAGE IS DELIBERATE AND IS THE CENTRAL CAPITAL FINDING.
  # The mortgage constant at a 7.25% / 25-yr note is 8.67%. The retained club
  # yields roughly 7% on retained cost. Borrowing at 8.67% to hold a 7% asset is
  # NEGATIVE LEVERAGE -- it lowers equity IRR and breaks the covenant. Modelled
  # across the leverage curve, IRR RISES as leverage falls (7.1% at 55% LTC,
  # 8.2% at 30%, 11.4% unlevered). 30% is chosen over zero to retain a covenant
  # cushion (1.90x) and balance-sheet flexibility, not to enhance returns.
  target_ltc: 0.30             # PERMANENT leverage on the retained asset

  # Construction financing is a SEPARATE facility from the permanent loan and is
  # sized on TOTAL project cost, not on the retained asset. Modelling only the
  # permanent note under-levers the build phase and overstates peak equity by
  # roughly $70M. The construction facility is repaid from for-sale closings and
  # taken out by the permanent loan at stabilization.
  construction_ltc: 0.60
  construction_rate: 0.0850    # matches cost.carry.interest_rate
  permanent_rate: 0.0725       # takeout/permanent coupon
  amortization_years: 25
  periods_per_year: 12

  # Which cost basis sizes the PERMANENT loan on the retained club.
  # `net` is the economically correct treatment for a merchant build: condo and
  # homesite closings retire construction debt, so the permanent note is
  # secured only by the retained income asset. Sizing it on `gross` lends
  # against collateral that has already been sold and moves DSCR by roughly
  # 2.4x -- it is the single most consequential switch in the debt block.
  permanent_sizing_basis: net    # net | gross

  # Interest-only through lease-up, converting to amortizing at stabilization.
  # This is how construction-to-permanent paper on a ramping asset is actually
  # structured; amortizing from the first operating day is not a conservative
  # assumption, it is the wrong one. `null` derives the period from the
  # stabilization year.
  interest_only_years: null
  # Lenders fund a debt-service reserve at close to cover the lease-up shortfall
  # and typically do not test the covenant until conversion.
  covenant_tested_from_stabilization: true
  debt_service_reserve_months: 18
  note: >
    Permanent coupon and amortization are ASSUMED, not quoted. 7.25% sits
    inside the 6.5%-8% range reported for commercial mortgages in 2026 [S2],
    biased to the upper half because a private motorsport club is a
    special-purpose asset with a thin resale market and no conforming agency
    execution. A 25-year amortization is likewise assumed; special-purpose
    collateral frequently draws 20-25 years rather than 30. Both must be
    replaced with a real term sheet before IC. Loan is sized on the same cost
    basis being tested, so DSCR is reported on the gross and net bases exactly
    as YoC is.

# -----------------------------------------------------------------------------
# STACK B — INCOME / HELD  (the 6.5% test)
# -----------------------------------------------------------------------------
# ALL VALUES ASSUMED until Comp Analyst returns verified figures from §7.
# These are structural placeholders so the model runs end to end, not estimates
# to be relied upon.
income:
  basis: assumed

  membership:
    cap: 340                     # total member slots at buildout (85 per track mile)
    cap_per_track_mile: 85       # sanity check against comp set
    initiation_fee_usd: 150000
    annual_dues_usd: 34000
    dues_escalator: 0.030
    expected_tenure_years: 12    # initiation amortization period
    ramp:                        # members added per year from opening
      - 88
      - 82
      - 68
      - 54
      - 48
    stabilization_threshold: 0.85  # §3: stabilized = 85% of cap

  # Initiation fee treatment. §3: do NOT capitalize into NOI.
  initiation_treatment:
    mode: amortized              # amortized | excluded | capitalized
    note: >
      Base case amortizes initiation over expected_tenure_years and includes
      that amortized slice in NOI. The Sensitivity tab reports NOI and YoC with
      initiation fully EXCLUDED and fully CAPITALIZED as the two bookends.

  # Ancillary at stabilization on a 340-member base. NOTE: the Northeast season
  # is materially shorter than the Thermal Club reference geography, so these are
  # NOT Thermal-intensity figures -- indoor storage and the karting/skidpad
  # complex are weighted up precisely because they earn in the shoulder season.
  ancillary_annual_usd:          # at stabilization, before opex
    track_rental_and_events: 2867500
    driving_school: 992000
    indoor_storage: 1209000
    fb_net_contribution: 480500
    service_dept_net_contribution: 651000
    ground_rent: 0               # zero: merchant build, both components sold

  # Opex set so the stabilized operating ratio lands INSIDE the 45-80% of EGI
  # band that private clubs actually run at. The v1.0 figures implied a 36%
  # operating ratio, which is implausibly efficient; correcting it is the single
  # largest negative revision in v2.0 and it is what forces low leverage.
  opex_annual_usd:               # at stabilization, EXCLUDING property tax
    club_and_fb_operations: 3045000
    track_and_grounds: 2058000
    insurance: 1092000           # motorsport liability is scarce and expensive
    general_admin: 1281000
    repairs_maintenance: 924000
    member_acquisition: 546000   # sales and marketing to replace churn

  # ---------------------------------------------------------------------------
  # PROPERTY TAX — modeled as a rate on assessed value, not a flat line.
  # ---------------------------------------------------------------------------
  # NY, CT and NJ carry some of the highest effective commercial property tax
  # rates in the country. A flat placeholder would be indefensible and a zero
  # line is simply wrong, so tax scales with the basis actually built.
  #
  # This makes NOI a function of the basis, which would normally destroy the
  # closed-form land solve. It does not: because tax is proportional to basis,
  #
  #     (NOI_0 - tau*B) / B = h    =>    B = NOI_0 / (h + tau)
  #
  # so an ad-valorem tax is exactly equivalent to ADDING tau to the required
  # yield. The inversion stays exact. See model/two_stack.py::tax_load.
  property_tax:
    basis: assumed
    # Share of the gross basis that stays on the club's tax bill. Sold garage
    # condos and homesites are separately assessed to their owners once
    # conveyed, so the retained club is not taxed on them.
    taxable_share_of_gross_basis: 0.65
    assessment_ratio: 0.70       # assessed value as a share of cost
    effective_rate: 0.0225       # combined municipal/county/school
    # BASE CASE ASSUMES A 50% ABATEMENT AND THE DEAL DOES NOT WORK WITHOUT ONE.
    # Modelled both ways: with a PILOT the covenant holds and IRR is ~8%; with no
    # abatement the covenant breaches and max supportable land goes NEGATIVE.
    # This is therefore a CONDITION PRECEDENT to closing, not an upside case.
    abatement_pct: 0.50

  management_fee_pct_egi: 0.040
  replacement_reserve_pct_egi: 0.034   # a circuit repaves on a 10-15 yr cycle

  # ---------------------------------------------------------------------------
  # SEASON LENGTH — the driver that makes geography an economic question
  # ---------------------------------------------------------------------------
  # Track-dependent revenue scales with usable days. A Northeast circuit runs
  # roughly half the year; Arizona operators advertise 275 days of access [S4].
  # Ancillary revenue is quoted at the BASELINE below and scaled per site by
  # `season_days`. Dues and initiation are NOT scaled -- members pay for access
  # and identity, which is less elastic than track-day throughput -- but the
  # Sensitivity tab flexes that assumption.
  season:
    basis: assumed
    baseline_days: 210           # Northeast: ~7 usable months
    ancillary_elasticity: 0.70   # share of ancillary that scales with season
    # The counterpart. Safety crew, corner workers, consumables, track prep and
    # hourly staff scale with days open; insurance, admin and fixed maintenance
    # do not. Without this, a 310-day site earns Sun Belt revenue on Northeast
    # cost and shows an operating ratio no private club has ever run.
    opex_elasticity: 0.28
  exit_cap: 0.0725               # for development-spread reporting
  exit_cost_pct: 0.020           # disposition costs at sale

# -----------------------------------------------------------------------------
# STACK A — FOR-SALE  (velocity, not yield)
# -----------------------------------------------------------------------------
for_sale:
  basis: assumed

  # Pre-sales. Garage condos and founding memberships are contracted off plan
  # during construction, with deposits held and the balance paid at closing.
  # Omitting this does not make the model conservative -- it makes the capital
  # stack wrong, because it funds the whole build before any revenue arrives and
  # inflates peak equity by roughly a third.
  presale:
    basis: assumed
    unit_presale_share: 0.45       # units under contract before completion
    deposit_pct: 0.20              # deposit at contract, balance at closing
    founding_member_share: 0.35    # memberships sold pre-opening
    founding_deposit_pct: 0.50     # initiation collected at signing

  garage_condos:
    units: 140
    avg_sf: 1800
    sale_price_psf: 530         # 1.51x hard cost — inside the plausible band
    hard_cost_psf: 350
    cost_of_sale_pct: 0.055
    absorption_units_per_year: 23

  homesites:
    units: 50
    price_per_unit_usd: 740000
    improvement_cost_per_unit_usd: 250000
    cost_of_sale_pct: 0.055
    absorption_units_per_year: 8

# -----------------------------------------------------------------------------
# DEVELOPMENT COST — non-land
# -----------------------------------------------------------------------------
# Land price is the SOLVED variable, never an input. See model/two_stack.py.
cost:
  basis: assumed

  track:
    miles: 4.0
    hard_cost_per_mile_usd: 4200000   # paving, base, drainage, barriers, runoff
    paddock_and_pit_usd: 6800000

  # Vertical scoped at 0.85x the v1.0 program — right-sized clubhouse rather
  # than a trophy build. Clubhouse ~$570/SF, which is high-end but buildable.
  vertical_hard_usd:
    clubhouse: 18275000               # 32,000 SF
    service_tech_center: 7565000      # 22,000 SF
    karting_skidpad_autocross: 3485000

  # Infrastructure at 0.70x the v1.0 greenfield program. THIS ASSUMES A
  # PRIOR-USE SITE -- a former airfield, quarry floor or capped landfill with
  # existing pavement, grading and utility stubs. On a raw greenfield parcel
  # these figures revert to v1.0 and the deal does not clear. Site typology is
  # therefore an economic requirement, not a preference.
  site_infrastructure_usd:
    earthwork_and_cutfill: 8750000
    utilities_and_three_phase: 4340000
    roads_and_access: 3780000
    stormwater_and_environmental: 3360000

  soft_cost_pct_of_hard: 0.180
  entitlement_budget_usd: 3500000     # incl. noise study, SEQRA/CEPA, counsel
  ffe_usd: 4200000
  contingency_pct: 0.100              # applied to hard + soft

  carry:
    interest_rate: 0.0850
    avg_outstanding_pct: 0.55         # avg draw balance over the carry period
    development_years: 3.5
    # Merchant build: capital is outstanding until the last unit sells, so a
    # sell-out longer than the construction period extends the carry. This is
    # also the ONLY channel through which absorption reaches yield -- with it
    # off, the absorption axis of the sensitivity grid is decorative.
    # NOTE: avg_outstanding_pct was set for a ~3.5 year draw profile. When
    # sell-out extends the period, re-calibrate it -- holding 55% average
    # exposure across a much longer tail overstates carry.
    follows_absorption: true

  incentives_usd: 0                   # base case: zero. Upside only.

# -----------------------------------------------------------------------------
# COMPOSITE SCORE WEIGHTS (§11) — must total 100
# -----------------------------------------------------------------------------
scoring:
  basis: confirmed
  weights:
    entitlement_probability: 25
    yield_on_cost: 20
    physical_suitability: 15
    market_catchment: 15
    infrastructure_burden: 10
    deal_control: 10
    optionality: 5

# -----------------------------------------------------------------------------
# SENSITIVITY GRID (§9 Sensitivity tab)
# -----------------------------------------------------------------------------
sensitivity:
  membership_cap: [180, 215, 250, 285, 320]
  annual_dues_usd: [16000, 19000, 22000, 25000, 28000]
  track_hard_cost_per_mile_usd: [3400000, 3800000, 4200000, 4600000, 5000000]
  absorption_years: [4, 5, 6, 7, 8]

# -----------------------------------------------------------------------------
# SCENARIOS — coherent bundles, not one-at-a-time flexes
# -----------------------------------------------------------------------------
# A two-axis grid implicitly assumes the axes are independent. They are not. A
# soft cycle hits dues, absorption, condo pricing, construction cost and exit
# cap AT THE SAME TIME, and correlated stress is what actually kills programs.
# These bundles move the drivers together in the directions they historically
# co-move. Multipliers apply to the base case above.
scenarios:
  basis: assumed

  base:
    label: "Base — as configured"

  downside:
    label: "Downside — soft cycle, slow lease-up"
    dues_factor: 0.88
    cap_factor: 0.84             # membership cap achieved
    ancillary_factor: 0.80
    condo_psf_factor: 0.88
    homesite_price_factor: 0.88
    absorption_slowdown: 1.45    # sell-out period multiplier
    hard_cost_factor: 1.10
    opex_factor: 1.06
    exit_cap_bps: 75             # cap rate widening
    perm_rate_bps: 75
    ramp_stretch: 1.35           # ramp takes longer

  severe:
    label: "Severe — recession, entitlement drag, cost shock"
    dues_factor: 0.78
    cap_factor: 0.68
    ancillary_factor: 0.62
    condo_psf_factor: 0.75
    homesite_price_factor: 0.72
    absorption_slowdown: 2.10
    hard_cost_factor: 1.22
    opex_factor: 1.12
    exit_cap_bps: 175
    perm_rate_bps: 175
    ramp_stretch: 1.80

  upside:
    label: "Upside — pricing power, PILOT secured"
    dues_factor: 1.15
    cap_factor: 1.00
    ancillary_factor: 1.18
    condo_psf_factor: 1.12
    homesite_price_factor: 1.10
    absorption_slowdown: 0.85
    hard_cost_factor: 0.96
    opex_factor: 0.97
    exit_cap_bps: -50
    perm_rate_bps: -50
    ramp_stretch: 0.85
    abatement_pct: 0.60          # IDA PILOT / EDA secured

# -----------------------------------------------------------------------------
# MONTE CARLO — distribution, not a point estimate
# -----------------------------------------------------------------------------
# Triangular distributions (low, mode, high) as multipliers on the base case.
# Triangular is deliberate: it is the honest shape when you have a plausible
# range and a best guess but no data to justify a variance.
monte_carlo:
  basis: assumed
  iterations: 4000
  seed: 20260803
  # [low, MODE, high]. The MODE MUST EQUAL THE BASE CASE on every driver.
  #
  # It did not: six of the nine modes were set adverse to the underwriting
  # (hard cost 1.05, opex 1.02, absorption 1.20, exit cap +25bp, coupon +25bp,
  # membership 0.95). Drawn independently, nine independently-pessimistic
  # marginals compound into a joint distribution far worse than any coherent
  # scenario, and the run reported a 5% covenant-hold probability against a
  # base case that covers at 2.02x. That is not a finding about the deal; it is
  # two different central views of the world living in one config.
  #
  # If a 5% cost contingency is genuinely believed, it belongs in the base
  # case, not smuggled into the simulation. Asymmetry belongs in the SPREAD,
  # which is where it now lives -- every driver here still has a longer adverse
  # tail than favourable one.
  drivers:
    dues_factor:            [0.80, 1.00, 1.15]
    cap_factor:             [0.65, 1.00, 1.00]   # one-sided: cap is a ceiling
    ancillary_factor:       [0.60, 1.00, 1.20]
    condo_psf_factor:       [0.75, 1.00, 1.12]
    hard_cost_factor:       [0.92, 1.00, 1.28]
    opex_factor:            [0.94, 1.00, 1.16]
    absorption_slowdown:    [0.85, 1.00, 2.00]
    exit_cap_bps:           [-75, 0, 200]
    perm_rate_bps:          [-75, 0, 200]

# -----------------------------------------------------------------------------
# TORNADO — one-at-a-time driver ranking
# -----------------------------------------------------------------------------
tornado:
  basis: assumed
  swing_pct: 0.15              # +/- applied to each multiplicative driver
  rate_swing_bps: 100          # +/- applied to rate-style drivers

# -----------------------------------------------------------------------------
# MEMBERSHIP DEMAND FUNNEL
# -----------------------------------------------------------------------------
# ASSUMED, and the second-largest open item in the project after the club
# economics comps. These rates are benchmark-shaped judgment, not measured
# conversion. They are here because "the required membership is a few basis
# points of the HNW pool" is a statement that reads identically for a 520,000
# household catchment and a 98,000 household one, and a nationwide pipeline has
# to tell those apart.
#
# What survives the inputs being assumed is `demand.demand_break_even`, which
# reports how far any one of these rates can fall before coverage reaches 1.0x.
# Quote that, not the point estimate.
demand:
  basis: assumed
  collector_share: 0.085        # of HNW households owning a car worth tracking
  track_active_share: 0.28      # of those who actually drive it on a circuit
  reachable_share: 0.22         # unused placeholder; see reachable_share_base
  reachable_share_base: 0.22    # of the un-captured pool a campaign can reach
  annual_join_rate: 0.09        # of capturable prospects joining per year

  # Distance-decayed, because proximity is what makes a competitor a competitor.
  # A club nine miles away takes the same wallet; one a hundred miles away does
  # not. 100 mi is also the sentinel in sites_targets.csv for "nothing in the
  # club format within 100 miles", so an unserved market lands at zero capture.
  incumbent_capture_at_zero_mi: 0.45
  incumbent_decay_radius_mi: 100

  coverage_thin: 2.0            # below this, market size IS the risk
  coverage_comfortable: 5.0     # at or above, demand is a marketing question

# -----------------------------------------------------------------------------
# PLAUSIBILITY BANDS — internal-consistency guardrails
# -----------------------------------------------------------------------------
# These do not change any number. They catch pro formas that do not hang
# together -- the failure mode where each block looks defensible alone and the
# combination is impossible. Bands are judgment, flagged as assumed.
plausibility:
  basis: assumed
  for_sale_gross_margin: [0.10, 0.35]      # merchant-build norm
  condo_price_to_cost_ratio: [1.25, 1.85]
  opex_ratio_of_egi: [0.45, 0.80]          # private club operating ratio
  # Spans the national range, not the Northeast one. An abated NY site runs
  # ~7% of EGI; an unabated Nevada site at a 0.65% statutory rate runs ~4%.
  # Both are real. Only a figure outside [3.5%, 25%] means tau is mis-specified.
  property_tax_pct_of_egi: [0.035, 0.25]
  members_per_track_mile: [40, 90]
  reserve_per_track_mile_usd: [120000, 400000]
  value_to_cost: [0.90, 1.60]

# -----------------------------------------------------------------------------
# ROADMAP AND PLATFORM STRATEGY
# -----------------------------------------------------------------------------
# Milestone timing is DERIVED from the model wherever possible (construction
# period, stabilisation year, sell-out) so the roadmap cannot drift from the
# underwriting. Only the entitlement period and the platform cadence are
# independent inputs.
roadmap:
  basis: assumed
  entitlement_months: 33         # pre-application through permit issuance
  feasibility_months: 9          # Phase 0, inside the entitlement window
  # Cadence for starting each subsequent ground-up club, in months after the
  # prior one. Set by management bandwidth and capital recycling, not by demand.
  ground_up_stagger_months: 36
  # An acquisition of an existing facility reaches stabilised contribution far
  # faster than a ground-up build, because the circuit and entitlement exist.
  acquisition_ramp_months: 24

# Public-market readiness thresholds. JUDGMENT, not sourced. They exist so the
# IPO question gets a testable answer instead of an aspiration.
listing_thresholds:
  basis: assumed
  min_equity_value_usd: 500000000    # credible US small-cap listing
  min_recurring_noi_usd: 40000000    # recurring NOI / EBITDA scale
  min_stabilised_assets: 4           # diversification — single-asset issuers do not list
  min_operating_history_years: 2      # audited operating history at stabilisation
  note: >
    These are screening thresholds for whether a listing is even a conversation,
    not a prediction that one happens. A single-asset owner with under $10M of
    NOI has no public-market path at any point on the timeline; the question is
    only whether the platform reaches scale, and by which growth route.
